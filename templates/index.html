<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Alt Yazı Çevirici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: #10b981;
            color: white;
            margin-bottom: 10px;
        }

        .btn-success:hover {
            background: #059669;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .status-message {
            text-align: center;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            font-size: 16px;
            color: #555;
        }

        .status-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .download-buttons {
            display: none;
            margin-top: 20px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .feature {
            text-align: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 13px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube Alt Yazı Çevirici</h1>
            <p>İngilizce → Türkçe</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="youtube-url">YouTube Video URL</label>
                <input 
                    type="text" 
                    id="youtube-url" 
                    placeholder="https://www.youtube.com/watch?v=..."
                    autocomplete="off"
                >
            </div>

            <button class="btn btn-primary" id="start-btn">
                <span>Başlat</span>
            </button>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="status-message" id="status-message">
                    <div class="status-icon">⏳</div>
                    <div id="status-text">İşlem başlatılıyor...</div>
                </div>
            </div>

            <div class="error-message" id="error-message"></div>

            <div class="success-message" id="success-message">
                <div style="font-size: 48px; margin-bottom: 15px;">✅</div>
                <h2 style="margin-bottom: 10px;">Tebrikler!</h2>
                <p>Video başarıyla Türkçe alt yazı ile hazırlandı.</p>
            </div>

            <div class="download-buttons" id="download-buttons">
                <button class="btn btn-success" id="download-video-btn">
                    📥 Videoyu İndir
                </button>
                <button class="btn btn-success" id="download-subtitle-btn">
                    📄 Alt Yazı Dosyasını İndir (.srt)
                </button>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 20px; text-align: center; color: #555;">✨ Özellikler</h3>
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-text">Hızlı İşleme</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-text">Otomatik Çeviri</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <div class="feature-text">Mobil Uyumlu</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🆓</div>
                    <div class="feature-text">Ücretsiz</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>💡 Videoda İngilizce alt yazı olmalıdır</p>
            <p>🔒 Verileriniz güvenle işlenir</p>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let statusInterval = null;

        const urlInput = document.getElementById('youtube-url');
        const startBtn = document.getElementById('start-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const statusMessage = document.getElementById('status-message');
        const statusText = document.getElementById('status-text');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const downloadButtons = document.getElementById('download-buttons');
        const downloadVideoBtn = document.getElementById('download-video-btn');
        const downloadSubtitleBtn = document.getElementById('download-subtitle-btn');

        startBtn.addEventListener('click', startProcessing);
        downloadVideoBtn.addEventListener('click', () => downloadFile('video'));
        downloadSubtitleBtn.addEventListener('click', () => downloadFile('subtitle'));

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startProcessing();
            }
        });

        async function startProcessing() {
            const url = urlInput.value.trim();

            if (!url) {
                showError('Lütfen bir YouTube URL giriniz!');
                return;
            }

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                showError('Geçerli bir YouTube URL giriniz!');
                return;
            }

            resetUI();
            startBtn.disabled = true;
            startBtn.innerHTML = '<div class="spinner"></div><span>İşleniyor...</span>';
            progressContainer.style.display = 'block';

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    resetButton();
                    return;
                }

                currentJobId = data.job_id;
                startStatusPolling();

            } catch (error) {
                showError('Bağlantı hatası! Sunucu çalışıyor mu kontrol edin.');
                resetButton();
            }
        }

        function startStatusPolling() {
            statusInterval = setInterval(checkStatus, 2000);
            checkStatus();
        }

        async function checkStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/status/${currentJobId}`);
                const data = await response.json();

                updateProgress(data.progress);
                updateStatus(data.message);

                if (data.status === 'completed') {
                    clearInterval(statusInterval);
                    showSuccess(data);
                } else if (data.status === 'error') {
                    clearInterval(statusInterval);
                    showError(data.error || 'Bilinmeyen bir hata oluştu!');
                    resetButton();
                }

            } catch (error) {
                console.error('Status check error:', error);
            }
        }

        function updateProgress(progress) {
            progressFill.style.width = progress + '%';
        }

        function updateStatus(message) {
            statusText.textContent = message;
        }

        function showSuccess(data) {
            successMessage.style.display = 'block';
            downloadButtons.style.display = 'block';
            progressContainer.style.display = 'none';
            resetButton();
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function resetUI() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            downloadButtons.style.display = 'none';
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
        }

        function resetButton() {
            startBtn.disabled = false;
            startBtn.innerHTML = '<span>Başlat</span>';
        }

        function downloadFile(type) {
            if (!currentJobId) return;
            window.location.href = `/api/download/${currentJobId}/${type}`;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (currentJobId && statusInterval) {
                clearInterval(statusInterval);
            }
        });
    </script>
</body>
</html>
